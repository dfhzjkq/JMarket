spring:
  application:
    name: JMarket

  datasource:
    url: jdbc:postgresql://localhost:5432/jmarket
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  data:
    web:
      pageable:
        max-page-size: 100

jmarket:
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-token-ttl: 15m

server:
  port: 8080
