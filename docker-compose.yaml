services:
  postgres:
    image: postgres:16
    container_name: jmarket-postgres
    environment:
      POSTGRES_DB: jmarket
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: jmarket-app
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/jmarket
      JWT_SECRET: ${JWT_SECRET}

volumes:
  postgres_data:
